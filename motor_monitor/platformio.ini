; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = espidf
extra_scripts = pre:generate_hash.py
extra_configs = secrets.ini

; Velocidade da porta serial para o monitor
monitor_speed = 115200

; Velocidade de upload (padrão funciona; ajuste se der timeout)
upload_speed = 115200

; Evita o PermissionError(13) ao tentar resetar a placa via DTR/RTS após o upload
upload_resetmethod = norun

; Evita que a placa resete (e a tela apague) quando você abre o Monitor Serial
;monitor_rts = 1
;monitor_dtr = 1
